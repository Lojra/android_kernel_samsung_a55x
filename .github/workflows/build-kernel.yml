name: Build Samsung Galaxy A55 Kernel (KSU-Next v3.4.2 + SUSFS)

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Galaxy A55 Kernel (Linux 6.1.155)
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev libelf-dev dwarves pahole
          mkdir -p clang-aosp
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz -O clang.tar.gz
          tar -C clang-aosp -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Checkout Kernel Source (A556EXXUACYIA)
        run: |
          git clone --depth=1 -b A556EXXUACYIA https://github.com/exynos1480/android_kernel_samsung_a55x.git kernel
          cd kernel
          rm -f android/abi_gki_protected_exports_*

      - name: Integrate KernelSU-Next (dev-susfs)
        working-directory: kernel
        run: |
          git clone --depth=1 -b dev-susfs https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
          cd drivers
          ln -sf ../KernelSU-Next/kernel kernelsu
          printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' Kconfig

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export PATH=$(pwd)/../clang-aosp/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 essi_defconfig

          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable CONFIG_KSU_SAMSUNG_KDP
          ./scripts/config --file out/.config --enable CONFIG_KSU_SAMSUNG_RKP
          ./scripts/config --file out/.config --enable CONFIG_KSU_SAMSUNG_DEFEX
          ./scripts/config --file out/.config --disable CONFIG_UH
          ./scripts/config --file out/.config --disable CONFIG_SECURITY_DEFEX
          ./scripts/config --file out/.config --disable CONFIG_KNOX_NCM

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "=== KSU & SUSFS Config Verification ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" out/.config

      - name: Build Kernel Binary
        working-directory: kernel
        run: |
          export PATH=$(pwd)/../clang-aosp/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" Image

          echo "=== Kernel Symbol Verification ==="
          strings out/arch/arm64/boot/Image | grep -i "susfs" | head -n 10
          strings out/arch/arm64/boot/Image | grep -i "kernelsu" | head -n 10

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master ak3
          echo "" | base64 -d > ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r9 ../A55-GlowingKernel-KSUNext-v3.4.2-SUSFS.zip *

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: A55-GlowingKernel-KSUNext-v3.4.2-SUSFS
          path: A55-GlowingKernel-KSUNext-v3.4.2-SUSFS.zip
